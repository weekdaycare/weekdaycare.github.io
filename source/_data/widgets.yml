# 您可以在这里创建属于自己的侧边栏组件库，在需要的位置放置自己的组件
# layout即组件布局，支持自定义的有：
# - markdown: 渲染 md 文本
#

# ---- 内置组件，暂时不支持覆盖 ----
ghrepo:
  layout: ghrepo
related:
  layout: related

ghissues:
  layout: ghissues
  title: # Recent Issues
  limit: 3 # 显示的issues最大数量
  labels: # 过滤只显示具有某些标签的issues

# 将其覆盖设置为空，可删除一个默认组件，例如 welcome:
# Recent update
recent:
  layout: recent
  rss: /atom.xml # npm i hexo-generator-feed
  limit: 3 # Count of posts
# TOC (valid only in layout:post/wiki)
toc:
  layout: toc
  list_number: false
  min_depth: 2
  max_depth: 5
  fallback: recent # Use a backup widget when toc does not exist.
  collapse: false # true / false / auto (始终折叠/不折叠/自动折叠)
# github user info
ghuser:
  layout: ghuser
  api: https://raw.weekdaycare.cn/api
  username: weekdaycare # your github login username
  avatar: true # true / false

tagcloud:
  layout: tagcloud
  title: 词云
  # 标签云配置
  min_font: 12
  max_font: 24
  amount: 100
  orderby: name
  order: 1 # 1, sac 升序；-1, desc 降序
  color: true # 使用颜色
  start_color: '#b700ff' # 开始的颜色。您可使用十六进位值（#b700ff），rgba（rgba(183, 0, 255, 1)），hsla（hsla(283, 100%, 50%, 1)）或 颜色关键字。此变量仅在 color 参数开启时才有用。
  end_color: '#ffb700' # 结束的颜色。您可使用十六进位值（#b700ff），rgba（rgba(183, 0, 255, 1)），hsla（hsla(283, 100%, 50%, 1)）或 颜色关键字。此变量仅在 color 参数开启时才有用。
  show_count: false # 显示每个标签的文章总数

welcome:
  layout: markdown
  title: 你好，旅人：
  content: | # support markdown
    <script src="https://v1.hitokoto.cn/?encode=js&select=%23hitokoto" defer></script><span id="hitokoto">一言ing……</span>

timeline:
  layout: timeline
  title: 动态
  api: https://raw.weekdaycare.cn/api/repos/weekdaycare/weekdaycare.github.io/issues?per_page=1
  user: weekdaycare
  type: # 默认不用写，如果是友链朋友圈数据请写 fcircle
  limit: # 默认通过 api 上增加 per_page 来设置，如果是友链朋友圈，可通过这个设置数量
  hide: footer

'朋友圈':
  layout: timeline
  title: 朋友圈
  api: https://raw.weekdaycare.cn/raw/hexo-friends-rss/main/data.json # 你的朋友圈数据文件地址
  type: fcircle
  limit: 40 # 可通过这个限制数量