    js: /js/services/twikoo_new.js
  waline:
    js: /js/services/waline_new.js
  giscus:
    js: /js/services/giscus_new.js


# 扩展插件接入方法：(插件名下面用 #plugin# 代替)
# 1. 在这里增加 #plugin# 配置，至少赢含有 enable 字段，默认为空（不启用）
# 2. 新建文件 layout/_plugins/#plugin#.ejs 文件中设置编写加载代码。
# 2.1. 在该文件中可以直接使用 conf 来读取用户在【步骤 1】填写的配置字段内容
# 2.2. 如果需要引入 css 或 js，可以使用 utils.css(xxx)、utils.js(xxx)，具体可参考 layout/_plugins/fancybox.ejs
# 2.3. 如果需要本地 js 文件，请放入 /source/js/plugins 文件夹中，引入方式为：utils.js('/js/plugins/xxx.js');
# 3. 如果这个插件只需要引入外部文件，可以在【步骤 1】处增加 inject 字段，而无需进入【步骤 2】创建 ejs，参考 katex
plugins:
  # preload
  preload:
    enable: true
    service: flying_pages # flying_pages
    flying_pages: https://cdnjs.onmicrosoft.cn/ajax/libs/flying-pages/2.1.2/flying-pages.min.js

  # lazyload
  # https://www.npmjs.com/package/vanilla-lazyload
  lazyload:
    enable: true # [hexo clean && hexo s] is required after changing this value.
    js: https://cdnjs.onmicrosoft.cn/ajax/libs/vanilla-lazyload/17.8.4/lazyload.min.js
    transition: blur # blur, fade

  # https://fancyapps.com/docs/ui/fancybox/
  # available for {% image xxx %}
  fancybox:
    enable: true
    loader: /js/plugins/fancybox-loader.js
    js: https://cdnjs.onmicrosoft.cn/ajax/libs/fancyapps-ui/5.0.22/fancybox/fancybox.umd.min.js
    css: https://cdnjs.onmicrosoft.cn/ajax/libs/fancyapps-ui/5.0.22/fancybox/fancybox.min.css
    # 让 md 语法图片支持放大可以这样写: .md-text img:not([class]), .md-text .image img
    # 可以处理评论区的图片（不支持 iframe 类评论系统）例如：
    # 使用 twikoo 评论可以写: .tk-content img:not([class*="emo"])
    # 使用 waline 评论可以写: #waline_container .vcontent img
    selector: .tk-content img:not([class*="emo"]) # 多个选择器用英文逗号隔开

  # swiper
  swiper:
    enable: true
    css: https://npm.onmicrosoft.cn/swiper@10.3.1/swiper-bundle.min.css
    js: https://npm.onmicrosoft.cn/swiper@10.3.1/swiper-bundle.min.js

  # https://scrollrevealjs.org/api/reveal.html
  scrollreveal:
    enable: #true
    js: https://cdnjs.onmicrosoft.cn/ajax/libs/scrollReveal.js/4.0.9/scrollreveal.min.js
    distance: 16px
    duration: 800 # ms
    interval: 100 # ms
    scale: 1 # 0.1~1
  
  # AI 摘要
  # https://github.com/qxchuckle/Post-Summary-AI
  tianli_gpt: 
    enable: #true
    js: https://jsd.onmicrosoft.cn/gh/qxchuckle/Post-Summary-AI@6.0/chuckle-post-ai.min.js
    field: wiki # all, post, wiki
    key: 5Q5mpqRK5DkwT1X9Gi5e # tianli_gpt key
    total_length: 1000 # 设置提交的字数限制，默认为1000字，上限为5000，超过5000字符将被截断
    typewriter: true # 打字机动画 
    summary_directly: true # 是否直接显示摘要，否则显示 AI 简介
    rec_method: all # all, web # 文章推荐方式，all：匹配数据库内所有文章进行推荐，web：仅当前站内的文章，默认all
    hide_shuttle: true # 是否隐藏矩阵穿梭
    summary_toggle: false
    interface:
      name: AI摘要
      introduce: '我是文章辅助AI: QX-AI，点击下方的按钮，让我生成本文简介、推荐相关文章等。'
      version: TianliGPT
      button: ["介绍自己", "推荐文章", "生成摘要", "矩阵穿梭"]


  # Katex - The fastest math typesetting library for the web
  # https://katex.org/docs/autorender.html
  # https://github.com/KaTeX/KaTeX
  # 使用 hexo-renderer-markdown-it-plus 作为公式渲染器：npm uninstall hexo-renderer-marked --save npm install hexo-renderer-markdown-it-plus --save
  katex:
    enable: #true # 可以在特定文章的 front-matter 中设置 katex: true 来开启，也可以在这里设置全局开启
    inject: |
      <link rel="stylesheet" href="https://gcore.jsdelivr.net/npm/katex@0.16.4/dist/katex.min.css" integrity="sha384-vKruj+a13U8yHIkAyGgK1J3ArTLzrFGBbBc0tDp4ad/EyewESeXE/Iv67Aj8gKZ0" crossorigin="anonymous">
      <script defer src="https://gcore.jsdelivr.net/npm/katex@0.16.4/dist/katex.min.js" integrity="sha384-PwRUT/YqbnEjkZO0zZxNqcxACrXe+j766U2amXcgMg5457rve2Y7I6ZJSm2A0mS4" crossorigin="anonymous"></script>
      <script defer src="https://gcore.jsdelivr.net/npm/katex@0.16.4/dist/contrib/auto-render.min.js" integrity="sha384-+VBxd3r6XgURycqtZ117nYw44OOcIax56Z4dCRWbxyPt0Koah1uHoK0o4+/RRE05" crossorigin="anonymous"onload="renderMathInElement(document.body);"></script>
  
  # MathJax
  # 需在Markdown文件开头加入mathjax: true
  # 推荐使用Pandoc: npm uninstall hexo-renderer-marked --save & npm install hexo-renderer-pandoc --save
  mathjax:
    enable: # true # 可以在特定文章的 front-matter 中设置 mathjax: true 来开启，也可以在这里设置全局开启
    js: https://cdnjs.onmicrosoft.cn/ajax/libs/mathjax/2.7.6/MathJax.js?config=TeX-AMS-MML_HTMLorMML

  # Mermaid - markdwon to flow chart, seq chart, class chart ...
  # 需要安装 npm install --save hexo-filter-mermaid-diagrams
  # 使用时 需要在Markdown文件开头加入 mermaid: true
  # 使用示例：
  # ```mermaid
  # graph LR
  #   A(Section A) -->|option 1| B(Section A)
  #   B -->|option 2| C(Section C)
  # ```
  mermaid:
    enable: # true # 可以在特定文章的 front-matter 中设置 mermaid: true 来开启，也可以在这里设置全局开启
    style_optimization: false # use custom style in stellar
    # js: https://unpkg.com/mermaid@9.0.0/dist/mermaid.min.js
    js: https://npm.onmicrosoft.cn/mermaid@9.0.0/dist/mermaid.min.js
    # Available themes: default | dark | forest | neutral
    theme: neutral
  
  # 代码块复制按钮
  copycode:
    enable: true
    default_text: 'Copy'
    success_text: 'Copied'
    toast: 复制成功
  
  expire: # 文章时效提醒
    enable: true
    field: wiki # post, wiki, all 
    color: orange # red, orange...
    expiredDays: 45
    
  
  # 赫蹏 (Heti) - 专为中文网页内容设计的排版样式增强
  # https://github.com/sivan/heti
  heti:
    enable: false # 此插件会和代码块冲突，仅适用于纯中文博主。
    css: https://unpkg.com/heti@0.9.2/umd/heti.min.css
    js: https://unpkg.com/heti@0.9.2/umd/heti-addon.min.js



style:
  prefers_theme: auto # auto / light / dark
  smooth_scroll: false # true / false 开启时如果目录过长可能无法准确定位
  font-size:
    root: 16px # 改这个会影响全局所有文字的字号
    body: 17px # 影响正文区域的字号，如果改成 px 则不受 root 影响
    code: 85% # 相较于其所在行的文本大小，建议用百分比
    codeblock: 0.8125rem # 13px
  font-family:
    logo: '"Source Han Serif CN for Display", STZhongsong, "Microsoft Yahei", system-ui, Segoe UI, -apple-system, Roboto, Ubuntu, Helvetica Neue, Arial, WenQuanYi Micro Hei, sans-serif'
    body: '"Source Han Serif CN for Display", "华文中宋", system-ui, Segoe UI, -apple-system, Roboto, Ubuntu, Helvetica Neue, Arial, WenQuanYi Micro Hei, sans-serif'
    code: '"Cascadia Code", Menlo, Monaco, Consolas, system-ui, Courier New, monospace, sans-serif'
    codeblock: '"Cascadia Code", Menlo, Monaco, Consolas, system-ui, "Courier New", monospace, sans-serif'
  text-align: left
  prefix:
    h2: https://api.iconify.design/ci:heading-h2.svg
  border-radius:
    card-l: 6px # 侧边栏、文章横幅位置的圆角
    card: 6px # 文章内大部分卡片的圆角
    bar: 6px # 横条类元素的圆角
    image: 6px # 图片圆角
  color:
    # 动态颜色（会根据明暗主题重设明度值，只用关心色相和饱和度即可）
    background: 'hsl(212 16% 98%)' # 浅色背景颜色
    block: 'hsl(212 8% 95%)' # 块背景颜色
    code: 'hsl(220 20% 10%)' # 'hsl(14 100% 48%)' # 行内代码颜色
    text: 'hsl(0 0% 20%)' # 文本颜色
    # 主题色配置（不会根据明暗动态调整，请设置为通用的颜色）
    theme: '#F4511E' # 主题色
    accent: '#D50000' # 强调色
    link: '#F4511E' # 超链接颜色
    hover: '#7E57C2' # 按钮高亮颜色
  animated_avatar:
    animate: # auto, always
    background: https://jsd.onmicrosoft.cn/gh/cdn-x/placeholder@1.0.12/avatar/round/rainbow64@3x.webp
  codeblock:
    scrollbar: 4px
    highlightjs_theme: https://jsd.onmicrosoft.cn/gh/highlightjs/cdn-release@11.9.0/build/styles/atom-one-dark.min.css
  loading:
    loading: ∠( ᐛ 」∠)＿
    error: Σ(っ °Д °;)っ
  gradient: # https://webgradients.com/
    start: 'linear-gradient(to right, hsl(215, 95%, 64%), hsl(195, 95%, 60%), hsl(165, 95%, 56%), hsl(165, 95%, 56%), hsl(195 95% 60%), hsl(215, 95%, 64%))'
  leftbar:
    # 可以设置：纯色/渐变色/图片作为背景
    # background: var(--leftbar-bg)
    background-image: #url(https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.13/image/sidebar-bg1@small.jpg)
    blur-px: #100px
    blur-bg: #var(--alpha60)
  paginator:
    prev: https://jsd.onmicrosoft.cn/gh/cdn-x/placeholder@1.0.12/arrow/f049bbd4e88ec.svg
    next: https://jsd.onmicrosoft.cn/gh/cdn-x/placeholder@1.0.12/arrow/064b95430caf4.svg
  error_page: https://jsd.onmicrosoft.cn/gh/cdn-x/placeholder@1.0.12/404/1c830bfcd517d.svg
  site:
    background-image: #'url(https://gcore.jsdelivr.net/gh/cdn-x/placeholder@1.0.14/image/site-bg1@small.webp)' # 未完全适配，慎用
    blur-px: #100px
    blur-bg: #var(--alpha75)


