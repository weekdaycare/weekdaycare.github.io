######## Stellar info ########
stellar:
  version: '1.18.4'
  homepage: 'https://xaoxuu.com/wiki/stellar/'
  repo: 'https://github.com/xaoxuu/hexo-theme-stellar'
  cdn_css: # Use cdn links instead of /css/main.css
  cdn_js: # Use cdn links instead of /js/main.js


######## head tags ########
open_graph:
  enable: true
  twitter_id: # for open_graph meta


######## Sidebar ########
sidebar:
  logo:
    avatar: '[config.avatar](/about/)' # you can set avatar link in _config.yml or '[https://xxx.png](/about/)'
    title: '[config.title](/)' # you can set html tag like: '[<img no-lazy height="32px" src="xxx"/>](/)'
  menu:
    post: '[btn.blog](/)'
    wiki: '[智库](/wiki/)'
    notes: '[便笺](/notes/)'
    friends: '[友人](/friends/)'
    # about: '[更多](/about/)'
  # Sidebar widgets
  widgets:
    #### 自动生成的页面 ####
    # 主页
    home: welcome, timeline, search # for home
    # 博客索引页
    blog_index: search, recent, timeline # for categories/tags/archives
    # 文档索引页
    wiki_index: search, welcome, recent # for wiki
    # 其它（404）
    others: search, recent # for 404 and ...
    #### 手动创建的页面 ####
    # 文章内页
    post: search, toc, ghrepo, ghissues # for pages using 'layout:post'
    # 文档内页
    wiki: search, ghrepo, toc, ghissues, related # for pages using 'layout:wiki'
    # 其它 layout:page 的页面
    page: welcome, toc, search # for custom pages using 'layout:page'

######## Index ########
post-index: # 近期发布 分类 标签 归档 and ...
  # '虫洞': https://www.foreverblog.cn/go.html
  '说说': /shuoshuo/
  # '朋友圈': /friends/

######## Main ########
breadcrumb:
  home: home # config.title / config.author / home or custom content


######## Article ########
article:
  # 如果没有指定封面，是否根据 tags 作为关键词搜索封面图片？
  auto_cover: false # search from https://source.unsplash.com/
  # 如果没有指定横幅，是否根据 tags 作为关键词搜索横幅图片？
  auto_banner: false # search from https://source.unsplash.com/
  # 如果没有指定 excerpt 和 description，将自动取多长的内容作为文章摘要？
  auto_excerpt: 100
  # 分类颜色
  category_color:
    '杂七杂八': "#854836"
    '学习感悟': "#F14E32"
    '奇技淫巧': "#E2A5AD"
    '日常随笔': "#7B68EE"
  # 文章许可协议
  license: '[CC BY-NC-ND 4.0](https://creativecommons.org/licenses/by-nc-sa/4.0/) 转载请注明出处'
  # 分享
  share: # [wechat, weibo, email, link]
  # 相关文章，需要安装插件 (for layout: post)
  # npm i hexo-related-popular-posts
  related_posts:
    enable: false
    max_count: 5

# 文章搜索
search:
  service: local_search # local_search, todo...
  local_search: # 在 front-matter 中设置 indexing:false 来避免被搜索索引
    field: all # post, page, all
    path: /search.json # 搜索文件存放位置
    content: true # 是否搜索内容
    codeblock: false # 是否搜索代码块（需要content: true)

######## Comments ########
comments:
  service: waline # beaudar, utterances, valine, twikoo, waline
  # beaudar
  # https://beaudar.lipk.org/
  beaudar:
    repo: weekdaycare/blog-comments
    issue-term: url
    issue-number: 10
    theme: preferred-color-scheme
    label: 
    input-position: top # top/bottom 评论框位置
    comment-order: desc # desc 排序
    keep-theme: # true/false
    loading: true
    branch: main
  # utterances
  # https://utteranc.es/
  utterances:
    repo: xxx/xxx
    issue-term: pathname
    issue-number:
    theme: preferred-color-scheme
    label:
  # giscus
  # https://giscus.app/zh-CN
  giscus:
    data-repo: xxx/xxx # [在此输入仓库]
    data-repo-id: # [在此输入仓库 ID]
    data-category: # [在此输入分类名]
    data-category-id:
    data-mapping: pathname
    data-strict: 0
    data-reactions-enabled: 1
    data-emit-metadata: 0
    data-input-position: top # top, bottom
    data-theme: preferred_color_scheme
    data-lang: zh-CN
    data-loading: lazy
    crossorigin: anonymous

  # Twikoo
  # https://twikoo.js.org/
  twikoo:
    js: https://jsd.onmicrosoft.cn/npm/twikoo@1.4.0/dist/twikoo.all.min.js # 建议锁定版本
    envId: https://xxx # vercel函数
  waline:
    js: https://npm.onmicrosoft.cn/@waline/client@v2/dist/waline.js
    css: https://npm.onmicrosoft.cn/@waline/client@v2/dist/waline.css
    # Waline server address url, you should set this to your own link
    serverURL: https://comment.weekdaycare.cn

    # If false, comment count will only be displayed in post page, not in home page
    commentCount: true

    # Pageviews count, Note: You should not enable both `waline.pageview` and `leancloud_visitors`.
    pageview: false

    # Custom locales
    locale:
      placeholder: 来都来了，不说点啥嘛？（填写邮箱可以在博主回复时收到通知哦） # Comment box placeholder

    # Custom emoji
    emoji: 
        - https://raw.weekdaycare.cn/raw/waline-blobcatemojis/main/blobs
        - https://raw.weekdaycare.cn/raw/waline-fluentemoji/main/assets
    #   - https://unpkg.com/@waline/emojis@1.1.0/weibo
    #   - https://unpkg.com/@waline/emojis@1.1.0/alus
    #   - https://unpkg.com/@waline/emojis@1.1.0/bilibili
    #   - https://unpkg.com/@waline/emojis@1.1.0/qq
    #   - https://unpkg.com/@waline/emojis@1.1.0/tieba
    #   - https://unpkg.com/@waline/emojis@1.1.0/tw-emoji
    #   - https://unpkg.com/@waline/emojis@1.1.0/bmoji

    # Comment infomation, valid meta are nick, mail and link
    # meta:
    #   - 昵称
    #   - 邮箱
    #   - 链接

    # Set required meta field, e.g.: [nick] | [nick, mail]
    # requiredMeta:
    #   - nick

    # Language, available values: en-US, zh-CN, zh-TW, pt-BR, ru-RU, jp-JP
    lang: zh-CN

    # Word limit, no limit when setting to 0
    wordLimit: 500

    # Whether enable login, can choose from 'enable', 'disable' and 'force'
    # login: enable

    # comment per page
    pageSize: 5
  # Artalk
  # https://artalk.js.org/
  artalk:
    css: https://npm.onmicrosoft.cn/artalk@2.4.3/dist/Artalk.css
    js: hhttps://npm.onmicrosoft.cn/artalk@2.4.3/dist/Artalk.js 
    server: # 后端服务地址
    placeholder: ''
    darkMode: auto

