######## Tag Plugins ########
tag_plugins:
  # {% box %} / {% note %}
  note:
    default_color: '' # light, dark, red, orange, yellow, green, cyan, blue, purple, warning, error
    border: false # true / false
  # {% checkbox %}
  checkbox:
    interactive: false # enable interactive for user
  # {% quot %}
  quot:
    default: # 可以自行配置多种图标方案
      prefix: https://bu.dusays.com/2022/10/24/63567d3e092ff.png
      suffix: https://bu.dusays.com/2022/10/24/63567d3e0ab55.png
    hashtag:
      prefix: https://bu.dusays.com/2022/10/24/63567d3e07da3.png
  # {% emoji %}
  emoji:
    default: https://raw.weekdaycare.cn/raw/waline-blobcatemojis/main/blobs/${name}.png
    fluent: https://raw.weekdaycare.cn/raw/waline-fluentemoji/main/assets/${name}.svg
    bbpng: https://emoj.ml/blob${name}.png
    bbgif: https://emoj.ml/ablob${name}.gif
  #  twemoji: https://fastly.jsdelivr.net/gh/twitter/twemoji/assets/svg/${name}.svg
  #  qq: https://fastly.jsdelivr.net/gh/cdn-x/emoji/qq/${name}.gif
  #  aru: https://fastly.jsdelivr.net/gh/cdn-x/emoji/aru-l/${name}.gif
  #  tieba: https://fastly.jsdelivr.net/gh/cdn-x/emoji/tieba/${name}.png
  # {% image %}
  image:
    fancybox: true # true, false
  copy:
    toast: 复制成功( •̀ ω •́ )✧
  # {% timeline %}
  timeline:
    max-height: 80vh
  # {% mark %}
  mark:
    default_color: orange # light, dark, red, orange, yellow, green, cyan, blue, purple, warning, error
  okr:
    border: true # 是否显示边框
    status: # 可以自行增加
      # 进行中状态
      in_track:
        color: blue # red, orange, yellow, green, cyan, blue, purple
        label: 进行中
      at_risk: 
        color: yellow
        label: 风险
      off_track:
        color: orange
        label: 搁置
      # 结果状态
      finished:
        color: green
        label: 已完成
      unfinished:
        color: red
        label: 未完成
  # {% gallery %}
  gallery:
    layout: grid # grid / flow
    size: mix # s / m / l / xl / mix
    ratio: square # origin / square



######## JS Plugins ########
plugins:
  ## required plugins ##
  # jquery
  jquery: https://jsd.onmicrosoft.cn/npm/jquery@3.5.1/dist/jquery.min.js

  # stellar api
  stellar:
    sites: /js/plugins/sites.js
    friends: /js/plugins/friends.js
    ghinfo: /js/plugins/ghinfo.js
    timeline: /js/plugins/timeline.js
    linkcard: /js/plugins/linkcard.js
    fcircle: /js/plugins/fcircle.js
    weibo: /js/plugins/weibo.js
    memos: /js/plugins/memos.js
    marked: /js/plugins/marked.js

  marked: https://cdn.bootcdn.net/ajax/libs/marked/4.0.18/marked.min.js

  ## optional plugins ##
  # preload
  preload:
    enable: true
    service: flying_pages # instant_page, flying_pages
    instant_page: https://jsd.onmicrosoft.cn/gh/volantis-x/cdn-volantis@4.1.2/js/instant_page.js
    flying_pages: https://jsd.onmicrosoft.cn/gh/gijo-varghese/flying-pages@2.1.2/flying-pages.min.js

  # image lazyload
  # https://www.npmjs.com/package/vanilla-lazyload
  lazyload:
    enable: true # [hexo clean && hexo s] is required after changing this value.
    js: https://jsd.onmicrosoft.cn/npm/vanilla-lazyload@17.3.1/dist/lazyload.min.js
    transition: blur # blur, fade

  # https://scrollrevealjs.org/api/reveal.html
  scrollreveal:
    enable: 
    js: https://jsd.onmicrosoft.cn/npm/scrollreveal@4.0.9/dist/scrollreveal.min.js
    distance: 4px
    duration: 400 # ms
    interval: 100 # ms
    scale: 0.9 # 0.1~1

  # https://fancyapps.com/docs/ui/fancybox/
  # available for {% image xxx %}
  fancybox:
    enable: true
    js: https://jsd.onmicrosoft.cn/npm/@fancyapps/ui@4.0/dist/fancybox.umd.js
    css: https://jsd.onmicrosoft.cn/npm/@fancyapps/ui@4.0/dist/fancybox.css
    # 可以处理评论区的图片（不支持 iframe 类评论系统）例如：
    # 使用valine评论可以写: .vcontent img:not(.vemoji)
    # 使用twikoo评论可以写: .tk-content img:not([class*="emo"])
    # 使用waline评论可以写: #waline_container .vcontent img
    selector: .tk-content img:not([class*="emo"]) # 多个选择器用英文逗号隔开

  # swiper
  swiper:
    enable: true
    css: https://npm.onmicrosoft.cn/swiper@8.4.5/swiper-bundle.min.css
    js: https://npm.onmicrosoft.cn/swiper@8.4.5/swiper-bundle.min.js


  # 赫蹏 (Heti) - 专为中文网页内容设计的排版样式增强
  # https://github.com/sivan/heti
  heti:
    enable: false  # 此插件会和代码块冲突，仅适用于纯中文博主。
    css: https://npm.onmicrosoft.cn/heti@0.9.2/umd/heti.min.css
    js: https://npm.onmicrosoft.cn/heti@0.9.2/umd/heti-addon.min.js

  # MathJax
  # 需在Markdown文件开头加入mathjax: true
  # 推荐使用Pandoc: npm uninstall hexo-renderer-marked --save & npm install hexo-renderer-pandoc --save
  mathjax:
    enable: false
    cdn: https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.6/MathJax.js?config=TeX-AMS-MML_HTMLorMML

  # Katex - The fastest math typesetting library for the web
  # https://katex.org/docs/autorender.html
  # https://github.com/KaTeX/KaTeX
  # 使用 hexo-renderer-markdown-it-plus 作为公式渲染器：npm uninstall hexo-renderer-marked --save npm install hexo-renderer-markdown-it-plus --save
  katex:
    enable: false
    min_css: <link rel="stylesheet" href="https://gcore.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.css" integrity="sha384-Xi8rHCmBmhbuyyhbI88391ZKP2dmfnOl4rT9ZfRI7mLTdk1wblIUnrIq35nqwEvC" crossorigin="anonymous">
    min_js: <script defer src="https://gcore.jsdelivr.net/npm/katex@0.16.0/dist/katex.min.js" integrity="sha384-X/XCfMm41VSsqRNQgDerQczD69XqmjOOOwYQvr/uuC+j4OPoNhVgjdGFwhvN02Ja" crossorigin="anonymous"></script>
    auto_render_min_js: <script defer src="https://gcore.jsdelivr.net/npm/katex@0.16.0/dist/contrib/auto-render.min.js" integrity="sha384-+XBljXPPiv+OzfbB3cVmLHf4hdUFHlWNZN5spNQ7rmHTXpd7WvJum6fIACpNNfIR" crossorigin="anonymous"onload="renderMathInElement(document.body);"></script>
    
  # Mermaid - markdwon to flow chart, seq chart, class chart ...
  # 需要安装 npm install --save hexo-filter-mermaid-diagrams
  # 使用时 需要在Markdown文件开头加入 mermaid: true
  # 使用示例：
  # ```mermaid
  # graph LR
  #   A(Section A) -->|option 1| B(Section A)
  #   B -->|option 2| C(Section C)
  # ```
  mermaid:
    enable: false
    # js: https://unpkg.com/mermaid@9.0.0/dist/mermaid.min.js
    js: https://cdn.jsdelivr.net/npm/mermaid@v9/dist/mermaid.min.js
    # Available themes: default | dark | forest | neutral
    theme: neutral
    
  # AI 摘要
  # https://github.com/zhheo/Post-Abstract-AI
  tianli_gpt:
    enable: false
    field: post # all, post, wiki
    api: RcqNI1MwOG4jG4mXrH4k
    typingAnimate: true # 打字机动画 

  # 代码块复制按钮
  copycode:
    enable: true
    js: /js/plugins/copycode.js
    default_text: 'Copy'
    success_text: 'Copied'
    toast: 复制成功

style:
  darkmode: auto # auto / always / false
  smooth_scroll: false # true / false
  font-size:
    root: 16px
    body: .9375rem # 15px
    code: 85% # 14px
    codeblock: 0.8125rem # 13px
  font-family:
    logo: 'STZhongsong, "Noto Serif SC", "Microsoft Yahei", system-ui, Segoe UI, -apple-system, Roboto, Ubuntu, Helvetica Neue, Arial, WenQuanYi Micro Hei, sans-serif'
    body: '"Noto Serif SC", "Microsoft Yahei", system-ui, Segoe UI, -apple-system, Roboto, Ubuntu, Helvetica Neue, Arial, WenQuanYi Micro Hei, sans-serif'
    code: '"Cascadia Code", Menlo, Monaco, Consolas, system-ui, Courier New, monospace, sans-serif'
    codeblock: '"Cascadia Code", Menlo, Monaco, Consolas, system-ui, "Courier New", monospace, sans-serif'
  text-align: left
  border-radius:
    card: 6px
    block: 6px
    bar: 6px
    image: 6px
  color:
    # 主题色配置（不会根据明暗动态调整，请设置为通用的颜色）
    theme: '#F4511E' # 主题色
    accent: '#D50000' # 强调色
    link: '#F4511E' # 超链接颜色
    button: '#1BCDFC' # 按钮颜色
    hover: '#7E57C2' # 按钮高亮颜色
    # 动态颜色（会根据明暗主题重设明度值，只用关心色相和饱和度即可）
    background: 'hsl(212 16% 98%)' # 浅色背景颜色
    block: 'hsl(212 8% 95%)' # 块背景颜色
    code: 'hsl(14 100% 48%)' # 行内代码颜色
    text: 'hsl(0 0% 20%)' # 文本颜色
  link:
    underline: true # true / false
  animated_avatar:
    animate: # auto, always
    background: https://jsd.onmicrosoft.cn/gh/cdn-x/placeholder@1.0.2/avatar/round/rainbow64@3x.webp
  codeblock:
    scrollbar: 4px
    highlightjs_theme: https://jsd.onmicrosoft.cn/gh/highlightjs/cdn-release@11.5.0/build/styles/atom-one-dark.min.css
  loading:
    loading: ∠( ᐛ 」∠)＿
    error: Σ(っ °Д °;)っ
  gradient: # https://webgradients.com/
    start: 'linear-gradient(to right, #fa709a 0%, #fee140 100%)'
    search: '#E0E0E0'

default:
  avatar: https://jsd.onmicrosoft.cn/gh/cdn-x/placeholder@1.0.1/avatar/round/3442075.svg
  link: https://jsd.onmicrosoft.cn/gh/cdn-x/placeholder@1.0.1/link/8f277b4ee0ecd.svg
  cover: https://jsd.onmicrosoft.cn/gh/cdn-x/placeholder@1.0.1/cover/76b86c0226ffd.svg
  image: https://jsd.onmicrosoft.cn/gh/cdn-x/placeholder@1.0.1/image/2659360.svg

