######## Tag Plugins ########
tag_plugins:
  # {% box %} / {% note %}
  note:
    default_color: '' # light, dark, red, orange, yellow, green, cyan, blue, purple, warning, error
    border: true # true / false
  # {% checkbox %}
  checkbox:
    interactive: false # enable interactive for user
  # {% quot %}
  quot:
    default: # 可以自行配置多种图标方案
      prefix: https://bu.dusays.com/2022/10/24/63567d3e092ff.png
      suffix: https://bu.dusays.com/2022/10/24/63567d3e0ab55.png
    hashtag:
      prefix: https://bu.dusays.com/2022/10/24/63567d3e07da3.png
    question:
      prefix: ph:seal-question-fill
  # {% emoji %}
  emoji:
    default: https://raw.weekdaycare.cn/raw/waline-blobcatemojis/main/blobs/{name}.png
    fluent: https://raw.weekdaycare.cn/raw/waline-fluentemoji/main/assets/{name}.svg
    bbpng: https://emoj.ml/blob{name}.png
    bbgif: https://emoj.ml/ablob{name}.gif
  icon:
    # 留空时，图标和文字颜色相同
    default_color: accent # theme, accent, red, orange, yellow, green, cyan, blue, purple
  # {% button 标题 链接 %}
  button:
    default_color: theme # theme, accent, red, orange, yellow, green, cyan, blue, purple
  # {% image %}
  image: 
    fancybox: true # true, false
  # {% copy xxx %}
  copy:
    toast: 复制成功( •̀ ω •́ )✧
  # {% coding %}
  coding:
    api: https://raw.weekdaycare.cn/code/
  # {% timeline %}
  timeline:
    max-height: 80vh
  # {% mark %}
  mark:
    default_color: orange # light, dark, red, orange, yellow, green, cyan, blue, purple, warning, error
  # {% hashtag %}
  hashtag:
    default_color: orange # red, orange, yellow, green, cyan, blue, purple
  # {% okr o1 percent:0.5 status:normal %}
  okr:
    border: true # 是否显示边框
    status: # 可以自行增加
      # 进行中状态
      in_track:
        color: blue # red, orange, yellow, green, cyan, blue, purple
        label: 进行中
      at_risk: 
        color: yellow
        label: 风险
      off_track:
        color: orange
        label: 搁置
      # 结果状态
      finished:
        color: green
        label: 已完成
      unfinished:
        color: red
        label: 未完成
  # {% gallery %}
  gallery:
    layout: grid # grid / flow
    size: mix # s / m / l / xl / mix
    ratio: square # origin / square


