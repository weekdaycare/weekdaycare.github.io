# /.github/workflows/auto_deploy.yml

name: CI

on:
  push:
    branches:
      - main

env:
  GIT_USER: weekdaycare
  GIT_EMAIL: weekdaycare@qq.com
  THEME_REPO: xaoxuu/hexo-theme-stellar
  THEME_BRANCH: main
  DEPLOY_REPO: weekdaycare/weekdaycare.github.io
  DEPLOY_BRANCH: main

jobs:
  build:
    name: Build on node ${{ matrix.node_version }} and ${{ matrix.os }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest]
        node_version: [16.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Checkout theme repo
        uses: actions/checkout@v2
        with:
          repository: ${{ env.THEME_REPO }}
          ref: ${{ env.THEME_BRANCH }}
          path: themes/stellar

      - name: Checkout deploy repo
        uses: actions/checkout@v2
        with:
          repository: ${{ env.DEPLOY_REPO }}
          ref: ${{ env.DEPLOY_BRANCH }}
          path: .deploy_git

      - name: Use Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node_version }}

      - name: Install dependencies
        run: |
          npm install

      - name: Install pandoc
        run: |
          cd /tmp
          wget -c https://github.com/jgm/pandoc/releases/download/2.14.0.3/pandoc-2.14.0.3-1-amd64.deb
          sudo dpkg -i pandoc-2.14.0.3-1-amd64.deb

      - name: Configuration environment
        env:
          HEXO_DEPLOY_PRI: ${{secrets.HEXO_DEPLOY_PRI}}
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai"
          mkdir -p ~/.ssh/
          echo "$HEXO_DEPLOY_PRI" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global user.name $GIT_USER
          git config --global user.email $GIT_EMAIL
          
      - name: Deploy hexo
        run: |
          npm run deploy

      - name: setup aliyun oss
        uses: manyuanrong/setup-ossutil@master
        with:
            endpoint: oss-cn-chengdu.aliyuncs.com
            access-key-id: ${{ secrets.KEY }} # 刚刚配置过的AccessKeyId
            access-key-secret: ${{ secrets.SECRET }} # 刚刚配置过的AccessKeySecret
      - name: cp files to aliyun
        run: ossutil cp -rf public oss://weekblog/ # 将xxxxx改为创建的Bucket名称，-rf表示覆盖