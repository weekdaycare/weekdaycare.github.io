# /.github/workflows/auto_deploy.yml

name: CI

on:
  push:
    branches:
      - main

env:
  GIT_USER: weekdaycare
  GIT_EMAIL: weekdaycare@qq.com
  THEME_REPO: weekdaycare/hexo-theme-stellar
  THEME_BRANCH: main
  DEPLOY_REPO: weekdaycare/weekdaycare.github.io
  DEPLOY_BRANCH: main
  R2_BUCKET_NAME: obsidian-hexo
  R2_REGION: us-east-1
  R2_ACCESS_KEY_ID: 1e240ee148c037aebcf01e40c8c29510
  R2_SECRET_ACCESS_KEY: 5901a28a274125807c2f2a4b33ae466b9033754d87797d6b9e515f903c722725
  R2_ENDPOINT: https://582d5db47fd6799d836b5d9a3f63f5d4.r2.cloudflarestorage.com

jobs:
  build:
    name: Build on node ${{ matrix.node_version }} and ${{ matrix.os }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [ubuntu-latest]
        node_version: [20.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Checkout theme repo
        uses: actions/checkout@v2
        with:
          repository: ${{ env.THEME_REPO }}
          ref: ${{ env.THEME_BRANCH }}
          path: themes/stellar
          
      - name: Setup AWS CLI for Cloudflare R2
        run: |
          sudo apt-get update
          sudo apt-get install awscli
          aws configure set aws_access_key_id ${{ secrets.R2_ACCESS_KEY_ID }}
          aws configure set aws_secret_access_key ${{ secrets.R2_SECRET_ACCESS_KEY }}
          aws configure set default.region ${{ secrets.R2_REGION }}
          aws configure set default.s3.signature_version s3v4
          aws configure set default.s3.endpoint_url ${{ secrets.R2_ENDPOINT }}

      - name: Sync files from Cloudflare R2 to source directory
        run: |
          mkdir -p source
          aws s3 sync s3://${{ secrets.R2_BUCKET_NAME }} source

      - name: Checkout deploy repo
        uses: actions/checkout@v2
        with:
          repository: ${{ env.DEPLOY_REPO }}
          ref: ${{ env.DEPLOY_BRANCH }}
          path: .deploy_git

      - name: Use Node.js ${{ matrix.node_version }}
        uses: actions/setup-node@v1
        with:
          node-version: ${{ matrix.node_version }}

      - name: Install dependencies
        run: |
          npm install

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Configuration environment
        env:
          HEXO_DEPLOY_PRI: ${{secrets.HEXO_DEPLOY_PRI}}
        run: |
          sudo timedatectl set-timezone "Asia/Shanghai"
          mkdir -p ~/.ssh/
          echo "$HEXO_DEPLOY_PRI" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          git config --global user.name $GIT_USER
          git config --global user.email $GIT_EMAIL
          
      - name: Deploy hexo
        run: |
          npm run deploy
